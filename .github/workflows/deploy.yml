name: Deploy birthday page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision site assets (first run only)
        run: |
          set -e
          changed=0
          if [ ! -f site/index.html ]; then
            echo "importing upstream static site"
            curl -fsSL -o src.zip https://codeload.github.com/ayusharma/birthday/zip/refs/heads/master
            unzip -q src.zip
            mkdir -p site
            cp -r birthday-master/. site/
            rm -f site/.gitignore src.zip
            changed=1
          fi
          if [ ! -f site/vendor/jquery.min.js ]; then
            echo "vendoring jquery / bootstrap / less.js"
            mkdir -p site/vendor
            curl -fsSL -o site/vendor/jquery.min.js https://cdn.jsdelivr.net/npm/jquery@1.11.2/dist/jquery.min.js
            curl -fsSL -o site/vendor/bootstrap.min.css https://cdn.jsdelivr.net/npm/bootstrap@3.3.1/dist/css/bootstrap.min.css
            curl -fsSL -o site/vendor/bootstrap.min.js https://cdn.jsdelivr.net/npm/bootstrap@3.3.1/dist/js/bootstrap.min.js
            curl -fsSL -o site/vendor/less.min.js https://cdn.jsdelivr.net/npm/less@2.1.0/dist/less.min.js
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A site
            git diff --cached --quiet || git commit -m "Provision site assets [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
